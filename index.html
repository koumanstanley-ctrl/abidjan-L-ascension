<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>Abidjan : L'Ascension</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game"></div>

    <div id="hud">

        <div class="panel">
            <div id="money">
                💰 10 000 FCFA
            </div>

            <div id="mission">
                🎯 Mission : Va au commerce
            </div>
        </div>

    </div>

    <div id="miniMap">
        <div id="mapPlayer"></div>
    </div>

    <button id="phoneButton">📱</button>

    <div id="phoneMenu">

        <h2>📱 Téléphone</h2>

        <p>
            💰 Argent :
            <span id="phoneMoney">10 000</span> FCFA
        </p>

        <p>⭐ Réputation : 0</p>

        <p>🏢 Entreprises : 0</p>

        <p>🚗 Véhicules : 0</p>

    </div>

    <div id="message"></div>

    <div id="joystick">
        <div id="stick"></div>
    </div>

    <button id="actionButton">⚡</button>


    <!-- Three.js -->

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <!-- Notre jeu -->

    <script src="game.js"></script>

</body>
</html>
